<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Defective Pendency Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
        input { width: 100%; padding: 10px; margin-bottom: 20px; font-size: 16px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; background: #fff; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <h2>Defective Pendency Dashboard</h2>
    <input type="text" id="searchInput" placeholder="Search by docket, product, warehouse, or status..." onkeyup="filterTable()">

    <table id="dataTable">
        <thead>
            <tr id="tableHeaders"></tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        // Replace with your published Google Sheet CSV URL
        const csvUrl = 'YOUR_PUBLISHED_CSV_URL_HERE';

        let tableData = [];

        async function loadData() {
            try {
                const response = await fetch(csvUrl);
                const data = await response.text();
                parseCSV(data);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function parseCSV(text) {
            const lines = text.split('\n').map(line => line.split(','));
            const headers = lines[0];
            tableData = lines.slice(1).filter(row => row.length === headers.length);

            // Render Headers
            const headerRow = document.getElementById('tableHeaders');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.textContent = header.replace(/"/g, '');
                headerRow.appendChild(th);
            });

            renderTable(tableData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            data.forEach(row => {
                const tr = document.createElement('tr');
                row.forEach(cell => {
                    const td = document.createElement('td');
                    td.textContent = cell.replace(/"/g, '');
                    tr.appendChild(td);
                });
                tbody.appendChild(tr);
            });
        }

        function filterTable() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = tableData.filter(row => 
                row.some(cell => cell.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        loadData();
    </script>

</body>
</html>
